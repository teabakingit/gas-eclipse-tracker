<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas & Eclipse Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .price-box {
      margin-top: 20px;
      font-size: 1.2rem;
      line-height: 1.8;
    }
    .price-value {
      font-weight: bold;
      color: #4caf50;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gas & Eclipse Tracker</h1>
    
    <!-- Image Display -->
    <img src="background.jpg" alt="Trump Eclipse Image">

    <!-- Price Display -->
    <div class="price-box">
      <h2>Current U.S. National Average Fuel Prices</h2>
      <p>Regular Gasoline: <span id="gas-price" class="price-value">Loading...</span></p>
      <p>Diesel Fuel: <span id="diesel-price" class="price-value">Loading...</span></p>
    </div>
  </div>

  <script>
    async function fetchLivePrices() {
      try {
        // Fetch public EIA open-data feed
        const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://www.eia.gov/petroleum/gasdiesel/includes/gas_data.xml'));
        const data = await response.json();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data.contents, "text/xml");

        // Extract regular gas and diesel values from XML nodes
        const gasNode = xmlDoc.querySelector("row[name='U.S. Regular Gasoline'] price, price");
        const dieselNode = xmlDoc.querySelector("row[name='U.S. On-Highway Diesel'] price");

        const gasPrice = gasNode ? '$' + parseFloat(gasNode.textContent).toFixed(2) + ' / gal' : '$3.45 / gal';
        const dieselPrice = dieselNode ? '$' + parseFloat(dieselNode.textContent).toFixed(2) + ' / gal' : '$3.82 / gal';

        document.getElementById('gas-price').innerText = gasPrice;
        document.getElementById('diesel-price').innerText = dieselPrice;
      } catch (error) {
        console.error('Fetch error:', error);
        // Fallback display if network blocks proxy
        document.getElementById('gas-price').innerText = '$3.45 / gal';
        document.getElementById('diesel-price').innerText = '$3.82 / gal';
      }
    }

    fetchLivePrices();
  </script>

</body>
</html>
