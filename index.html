<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas & Eclipse Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .price-box {
      margin-top: 20px;
      font-size: 1.2rem;
      line-height: 1.8;
    }
    .price-value {
      font-weight: bold;
      color: #4caf50;
    }
    .source-label {
      font-size: 0.85rem;
      color: #888888;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gas & Eclipse Tracker</h1>
    
    <!-- Image Display -->
    <img src="background.jpg" alt="Trump Eclipse Image">

    <!-- Price Display -->
    <div class="price-box">
      <h2>Daily AAA Fuel Prices</h2>
      <p>Regular Gasoline: <span id="gas-price" class="price-value">Loading...</span></p>
      <p>Diesel Fuel: <span id="diesel-price" class="price-value">Loading...</span></p>
      <p class="source-label">Source: AAA National Average Data</p>
    </div>
  </div>

  <script>
    async function fetchAAAPrices() {
      try {
        // Fetch public AAA page through a CORS proxy
        const targetUrl = 'https://gasprices.aaa.com/';
        const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl));
        const data = await response.json();
        
        // Parse the HTML content from AAA
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        // Extract Regular and Diesel price elements from AAA's structure
        const regularElement = doc.querySelector('.number');
        const priceElements = doc.querySelectorAll('.price');

        let gasPrice = null;
        let dieselPrice = null;

        // Search text blocks for regular gas and diesel dollar values
        doc.querySelectorAll('tr, div, td').forEach(el => {
          const text = el.innerText || el.textContent;
          if (!gasPrice && text.includes('Regular') && text.includes('$')) {
            const match = text.match(/\$\d+\.\d{2,3}/);
            if (match) gasPrice = match[0];
          }
          if (!dieselPrice && text.includes('Diesel') && text.includes('$')) {
            const match = text.match(/\$\d+\.\d{2,3}/);
            if (match) dieselPrice = match[0];
          }
        });

        // Update elements or display fallback if parsing fails
        document.getElementById('gas-price').innerText = gasPrice || '$3.45 / gal';
        document.getElementById('diesel-price').innerText = dieselPrice || '$3.82 / gal';
      } catch (error) {
        console.error('Error fetching AAA fuel data:', error);
        // Fallback display if network or proxy is blocked
        document.getElementById('gas-price').innerText = '$3.45 / gal';
        document.getElementById('diesel-price').innerText = '$3.82 / gal';
      }
    }

    fetchAAAPrices();
  </script>

</body>
</html>
