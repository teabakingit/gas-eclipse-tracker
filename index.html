<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gas & Eclipse Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .price-box {
      margin-top: 20px;
      font-size: 1.2rem;
      line-height: 1.8;
    }
    .price-value {
      font-weight: bold;
      color: #4caf50;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gas & Eclipse Tracker</h1>
    
    <!-- Your Image -->
    <img src="background.jpg" alt="Trump Eclipse Image">

    <!-- Step 1: The Display Boxes -->
    <div class="price-box">
      <h2>Live U.S. Fuel Prices</h2>
      <p>Gasoline (Regular): <span id="gas-price" class="price-value">Loading...</span></p>
      <p>Diesel: <span id="diesel-price" class="price-value">Loading...</span></p>
    </div>
  </div>

  <!-- Step 2: The Script That Fetches Data -->
  <script>
    async function fetchFuelPrices() {
      try {
        // Free API key required from eia.gov/opendata/
        const apiKey = 'YOUR_EIA_API_KEY';
        const response = await fetch(`https://api.eia.gov/v2/petroleum/pri/gnd/data/?api_key=${apiKey}&frequency=weekly&data[0]=value&sort[0][column]=period&sort[0][direction]=desc&length=2`);
        const data = await response.json();
        
        // Update page elements dynamically
        document.getElementById('gas-price').innerText = '$' + data.response.data[0].value + ' / gal';
        document.getElementById('diesel-price').innerText = '$' + data.response.data[1].value + ' / gal';
      } catch (error) {
        console.error('Error fetching prices:', error);
        document.getElementById('gas-price').innerText = 'API Key Required';
        document.getElementById('diesel-price').innerText = 'API Key Required';
      }
    }

    fetchFuelPrices();
  </script>

</body>
</html>
